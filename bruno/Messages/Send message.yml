info:
  name: Send message
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}/messages"
  body:
    type: json
    data: |-
      {
        "username": "jorge",
        "content": "Mensagem para jorge!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
